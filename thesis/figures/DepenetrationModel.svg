<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="170mm"
   height="58mm"
   viewBox="0 0 170 58"
   version="1.1"
   id="svgDepen"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title>Penetration-based contact resolution</title>
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" bordercolor="#666666" inkscape:document-units="mm" inkscape:pagecheckerboard="false"/>
  <defs id="defs">
    <marker id="ArrowBlack" orient="auto" refX="0" refY="0" markerUnits="strokeWidth" style="overflow:visible">
      <path d="M 3,0 L -6,-2.6 L -6,2.6 Z" style="fill:#000000;stroke:none"/>
    </marker>
    <marker id="ArrowBlue" orient="auto" refX="0" refY="0" markerUnits="strokeWidth" style="overflow:visible">
      <path d="M 3,0 L -6,-2.6 L -6,2.6 Z" style="fill:#2f5fa7;stroke:none"/>
    </marker>
    <marker id="ArrowRed" orient="auto" refX="0" refY="0" markerUnits="strokeWidth" style="overflow:visible">
      <path d="M 2,0 L -3,-1.8 L -3,1.8 Z" style="fill:#e2322b;stroke:none"/>
    </marker>
    <marker id="ArrowDim" orient="auto" refX="0" refY="0" markerUnits="strokeWidth" style="overflow:visible">
      <path d="M 0,0 L -4.5,-1.8 L -4.5,1.8 Z" style="fill:#000000;stroke:none"/>
    </marker>
  </defs>

  <!-- shared styles via attributes -->
  <!-- body A: light blue, body B: light gray -->

  <!-- ============ (a) Approach ============ -->
  <g id="panelA">
    <text x="20" y="4.5" style="font-family:'TeX Gyre Heros';font-size:3px;text-anchor:middle;fill:#000000">(a) Approach</text>
    <!-- body B -->
    <rect x="2" y="38" width="36" height="12" style="fill:#dcdcdc;stroke:#000000;stroke-width:0.35"/>
    <text x="4.5" y="46.2" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">B</text>
    <!-- contact offset band -->
    <path d="M 2,31 H 38" style="fill:none;stroke:#6f6f6f;stroke-width:0.3;stroke-dasharray:1.2,0.8"/>
    <!-- body A -->
    <rect x="8" y="21" width="16" height="12" style="fill:#cfdcef;stroke:#000000;stroke-width:0.35"/>
    <text x="9.5" y="25" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">A</text>
    <!-- offset dimension -->
    <path d="M 29.5,34.5 V 31.9" style="fill:none;stroke:#000000;stroke-width:0.22;marker-end:url(#ArrowDim)"/>
    <path d="M 29.5,34.5 V 37.1" style="fill:none;stroke:#000000;stroke-width:0.22;marker-end:url(#ArrowDim)"/>
    <text x="30.7" y="33.9" style="font-family:'TeX Gyre Heros';font-size:2.3px;fill:#000000">contact</text>
    <text x="30.7" y="36.6" style="font-family:'TeX Gyre Heros';font-size:2.3px;fill:#000000">offset</text>
    <!-- velocity -->
    <path d="M 16,10.5 V 17.6" style="fill:none;stroke:#2f5fa7;stroke-width:0.4;marker-end:url(#ArrowBlue)"/>
    <text x="17.4" y="14.6" style="font-family:'Latin Modern Roman';font-style:italic;font-weight:bold;font-size:3.4px;fill:#2f5fa7">v</text>
    <text x="20" y="55" style="font-family:'TeX Gyre Heros';font-size:2.4px;text-anchor:middle;fill:#555555">gap below offset: contact created</text>
  </g>

  <!-- ============ (b) Penetration ============ -->
  <g id="panelB" transform="translate(43,0)">
    <text x="20" y="4.5" style="font-family:'TeX Gyre Heros';font-size:3px;text-anchor:middle;fill:#000000">(b) Penetration</text>
    <rect x="2" y="38" width="36" height="12" style="fill:#dcdcdc;stroke:#000000;stroke-width:0.35"/>
    <text x="4.5" y="46.2" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">B</text>
    <rect x="8" y="29" width="16" height="12" style="fill:#cfdcef;stroke:#000000;stroke-width:0.35"/>
    <text x="9.5" y="33" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">A</text>
    <!-- overlap region -->
    <rect x="8" y="38" width="16" height="3" style="fill:#e2322b;fill-opacity:0.4;stroke:none"/>
    <path d="M 8,38 H 24" style="fill:none;stroke:#000000;stroke-width:0.25;stroke-dasharray:0.8,0.6"/>
    <rect x="8" y="29" width="16" height="12" style="fill:none;stroke:#000000;stroke-width:0.35"/>
    <!-- penetration depth -->
    <path d="M 24,41 H 28.5" style="fill:none;stroke:#000000;stroke-width:0.18"/>
    <path d="M 27.2,35 V 37.9" style="fill:none;stroke:#000000;stroke-width:0.22;marker-end:url(#ArrowDim)"/>
    <path d="M 27.2,44 V 41.1" style="fill:none;stroke:#000000;stroke-width:0.22;marker-end:url(#ArrowDim)"/>
    <path d="M 27.2,38 V 41" style="fill:none;stroke:#000000;stroke-width:0.22"/>
    <text x="28.6" y="40.7" style="font-family:'Latin Modern Roman';font-style:italic;font-size:3.4px;fill:#000000">d</text>
    <!-- contact normal -->
    <circle cx="16" cy="39.5" r="0.55" style="fill:#000000"/>
    <path d="M 16,39.5 V 33.6" style="fill:none;stroke:#000000;stroke-width:0.3;marker-end:url(#ArrowBlack)"/>
    <text x="17.1" y="35.2" style="font-family:'Latin Modern Roman';font-style:italic;font-weight:bold;font-size:3.4px;fill:#000000">n</text>
    <!-- velocity -->
    <path d="M 16,18.5 V 25.6" style="fill:none;stroke:#2f5fa7;stroke-width:0.4;marker-end:url(#ArrowBlue)"/>
    <text x="17.4" y="22.6" style="font-family:'Latin Modern Roman';font-style:italic;font-weight:bold;font-size:3.4px;fill:#2f5fa7">v</text>
    <text x="20" y="55" style="font-family:'TeX Gyre Heros';font-size:2.4px;text-anchor:middle;fill:#555555">overlap after one time step</text>
  </g>

  <!-- ============ (c) Depenetration ============ -->
  <g id="panelC" transform="translate(86,0)">
    <text x="20" y="4.5" style="font-family:'TeX Gyre Heros';font-size:3px;text-anchor:middle;fill:#000000">(c) Depenetration</text>
    <rect x="2" y="38" width="36" height="12" style="fill:#dcdcdc;stroke:#000000;stroke-width:0.35"/>
    <text x="4.5" y="46.2" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">B</text>
    <!-- ghost of penetrated pose -->
    <rect x="8" y="29" width="16" height="12" style="fill:#e2322b;fill-opacity:0.15;stroke:#8c8c8c;stroke-width:0.3;stroke-dasharray:1,0.7"/>
    <!-- resolved body A, resting on B -->
    <rect x="8" y="26" width="16" height="12" style="fill:#cfdcef;stroke:#000000;stroke-width:0.35"/>
    <text x="9.5" y="30" style="font-family:'TeX Gyre Heros';font-size:3.2px;fill:#555555">A</text>
    <!-- separating velocity on A and reaction on B -->
    <path d="M 16,37 V 29.4" style="fill:none;stroke:#e2322b;stroke-width:0.6;marker-end:url(#ArrowRed)"/>
    <path d="M 16,39 V 45.6" style="fill:none;stroke:#e2322b;stroke-width:0.6;marker-end:url(#ArrowRed)"/>
    <text x="25.3" y="31.5" style="font-family:'Latin Modern Roman';font-style:italic;font-weight:bold;font-size:3.4px;fill:#e2322b">v<tspan style="font-style:normal;font-weight:normal;font-size:2.3px" dy="0.8">sep</tspan></text>
    <text x="20" y="55" style="font-family:'TeX Gyre Heros';font-size:2.4px;text-anchor:middle;fill:#555555">pushed apart to rest offset</text>
  </g>

  <!-- ============ (d) Separating velocity ============ -->
  <g id="panelD" transform="translate(129,0)">
    <text x="20" y="4.5" style="font-family:'TeX Gyre Heros';font-size:3px;text-anchor:middle;fill:#000000">(d) Separating velocity</text>
    <!-- axes -->
    <path d="M 6,46 H 36.6" style="fill:none;stroke:#000000;stroke-width:0.3;marker-end:url(#ArrowBlack)"/>
    <path d="M 6,46 V 12.4" style="fill:none;stroke:#000000;stroke-width:0.3;marker-end:url(#ArrowBlack)"/>
    <text x="37.2" y="50" style="font-family:'Latin Modern Roman';font-style:italic;font-size:3.4px;text-anchor:end;fill:#000000">d</text>
    <text x="7.6" y="12.5" style="font-family:'Latin Modern Roman';font-style:italic;font-weight:bold;font-size:3.4px;fill:#000000">v<tspan style="font-style:normal;font-weight:normal;font-size:2.3px" dy="0.8">sep</tspan></text>
    <!-- cap -->
    <path d="M 6,22 H 38" style="fill:none;stroke:#6f6f6f;stroke-width:0.3;stroke-dasharray:1.2,0.8"/>
    <text x="5.3" y="23.1" style="font-family:'Latin Modern Roman';font-style:italic;font-size:3.4px;text-anchor:end;fill:#000000">v<tspan style="font-style:normal;font-size:2.3px" dy="0.8">max</tspan></text>
    <text x="37.5" y="20.3" style="font-family:'TeX Gyre Heros';font-size:2.2px;text-anchor:end;fill:#555555">max. depenetration velocity</text>
    <!-- response -->
    <path d="M 6,46 L 20,22 H 37" style="fill:none;stroke:#e2322b;stroke-width:0.6;stroke-linejoin:round"/>
    <text x="14.6" y="37" style="font-family:'Latin Modern Roman';font-size:3.4px;fill:#000000">∝ <tspan style="font-style:italic">d</tspan>/Δ<tspan style="font-style:italic">t</tspan></text>
  </g>
</svg>
